name = "wrishu-upload-signer"
main = "upload-signer.ts"
compatibility_date = "2024-04-01"

# Cloudflare R2 Bucket Binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "wrishu-portfolio-photos"

[vars]
ALLOWED_ORIGIN = "https://wrishu.com"
# SUPABASE_JWT_SECRET should be set via wrangler secret put SUPABASE_JWT_SECRET
